schema: 1
platforms:
  posix:
    symbol: LITECRAB_PLATFORM_POSIX
    provides: [threads, filesystem, http_client, net_server, openssl, process]
    sources: [src/platform/llm_transport_openssl.c]
  hi3516:
    symbol: LITECRAB_PLATFORM_HI3516
    provides: [threads, filesystem, llm_client, external_tools]
    sources: []
core_sources:
  - src/util/json.c
  - src/config/config.c
  - src/runtime/runtime.c
  - src/hub/hub.c
  - src/session/session.c
  - src/kernel/kernel.c
  - src/kernel/prompt.c
  - src/kernel/llm.c
  - src/kernel/working_memory.c
  - src/capability/capability_manager.c
  - src/security/approval.c
capabilities:
  observability:
    symbol: LITECRAB_CAP_OBSERVABILITY
    adapter: litecrab_cap_observability
    sources: [src/observability/observability.c, src/capability/cap_observability.c]
  memory:
    symbol: LITECRAB_CAP_MEMORY
    adapter: litecrab_cap_memory
    sources: [src/memory/memory.c, src/capability/cap_memory.c, src/runtime/tools/memory_tools.c]
    requires: [observability]
    requires_platform: [filesystem]
  skills:
    symbol: LITECRAB_CAP_SKILLS
    sources: [src/kernel/skill.c, src/runtime/tools/skill_tools.c]
    requires: [workspace_tools]
    requires_platform: [filesystem]
  workspace_tools:
    symbol: LITECRAB_CAP_WORKSPACE_TOOLS
    sources: [src/runtime/builtin_tools.c]
    requires_platform: [filesystem]
  process_tools:
    symbol: LITECRAB_CAP_PROCESS_TOOLS
    sources: [src/runtime/tools/process_tools.c]
    requires: [workspace_tools]
    requires_platform: [process]
  tcp_gateway:
    symbol: LITECRAB_CAP_TCP_GATEWAY
    adapter: litecrab_cap_gateway
    sources: [src/gateway/tcp_line.c, src/capability/cap_gateway.c]
    requires: [memory]
    requires_platform: [net_server, threads]
  alarm:
    symbol: LITECRAB_CAP_ALARM
    adapter: litecrab_cap_alarm
    sources:
      - src/alarm/alarm_app.c
      - src/alarm/alarm_service.c
      - src/alarm/alarm_notify.c
      - src/alarm/asp_client.c
      - src/alarm/polling/polling.c
      - src/alarm/subscription/subscription.c
      - src/capability/cap_alarm.c
    requires: [memory]
    requires_platform: [filesystem, http_client, threads]
    libraries: [curl]
  mcp_client:
    symbol: LITECRAB_CAP_MCP_CLIENT
    adapter: litecrab_cap_mcp
    sources:
      - src/mcp_client/protocol.c
      - src/mcp_client/http_transport.c
      - src/mcp_client/client_manager.c
      - src/capability/cap_mcp.c
    requires: [memory]
    requires_platform: [http_client, threads]
    libraries: [curl]
  embedded_agent_api:
    symbol: LITECRAB_CAP_EMBEDDED_AGENT_API
    sources: [src/app/embedded_agent.c, src/platform/llm_transport_hi3516.c]
    requires_platform: [threads]
  robot_tools:
    symbol: LITECRAB_CAP_ROBOT_TOOLS
    sources: [src/runtime/tools/robot_tools.c]
    requires: [embedded_agent_api]
    requires_platform: [external_tools]
  tts_output:
    symbol: LITECRAB_CAP_TTS_OUTPUT
    sources: []
    requires: [embedded_agent_api]
    requires_platform: [external_tools]
