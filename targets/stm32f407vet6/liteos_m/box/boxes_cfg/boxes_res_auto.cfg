/* Task pool sizing: the entry task and the box swtmr task each hold a slot
 * permanently. The event deep test parks two waiters at the same time - the
 * only way to tell WriteOnce's head-only wake from Write's wake-all - and the
 * demo keeps a late-dispatched child alive while creating the next one, so a
 * spare slot must remain or create returns TSK_NO_MEMORY. Nothing is left
 * over for a smaller pool. */
#define LOSCFG_BOXA_TASK_LIMIT        6
#define LOSCFG_BOXA_EVENT_LIMIT       4
#define LOSCFG_BOXA_MUX_LIMIT         4
#define LOSCFG_BOXA_QUEUE_LIMIT       1
#define LOSCFG_BOXA_SEM_LIMIT         2
#define LOSCFG_BOXA_COND_LIMIT        2
#define LOSCFG_BOXA_SHM_LIMIT         0
#define LOSCFG_BOXA_SWT_LIMIT         2
#define LOSCFG_BOXA_SWT_QUEUE_LEN     8
/* 14 = the guard sum below (EVT4 + MUX4 + QUE1 + SEM2 + COND2 + SHM0 = 13) plus
 * one slot of headroom. Every live IPC object draws exactly one SID slot, and
 * the box heap lock mux permanently holds one of the four MUX slots - which the
 * sum already counts, so 13 is the true floor. */
#define LOSCFG_BOXA_SID_LIMIT         14

#if LOSCFG_BOXA_SID_LIMIT < (LOSCFG_BOXA_EVENT_LIMIT + LOSCFG_BOXA_MUX_LIMIT + LOSCFG_BOXA_QUEUE_LIMIT + LOSCFG_BOXA_SEM_LIMIT + LOSCFG_BOXA_COND_LIMIT + LOSCFG_BOXA_SHM_LIMIT)
#error "BOXA SID number should be larger than or equal to total IPC number."
#endif

/* Two task slots: the box swtmr task holds one permanently, so the entry
 * task - which the kernel churn re-creates five times over - still has
 * exactly ONE slot to cycle through. A leaked TCB or kernel-stack node
 * therefore still fails the very next re-create, same as with a limit of 1. */
#define LOSCFG_BOXB_TASK_LIMIT        2
#define LOSCFG_BOXB_EVENT_LIMIT       0
#define LOSCFG_BOXB_MUX_LIMIT         1
#define LOSCFG_BOXB_QUEUE_LIMIT       0
#define LOSCFG_BOXB_SEM_LIMIT         0
#define LOSCFG_BOXB_COND_LIMIT        0
#define LOSCFG_BOXB_SHM_LIMIT         0
#define LOSCFG_BOXB_SWT_LIMIT         2
#define LOSCFG_BOXB_SWT_QUEUE_LEN     8
#define LOSCFG_BOXB_SID_LIMIT         1

#if LOSCFG_BOXB_SID_LIMIT < (LOSCFG_BOXB_EVENT_LIMIT + LOSCFG_BOXB_MUX_LIMIT + LOSCFG_BOXB_QUEUE_LIMIT + LOSCFG_BOXB_SEM_LIMIT + LOSCFG_BOXB_COND_LIMIT + LOSCFG_BOXB_SHM_LIMIT)
#error "BOXB SID number should be larger than or equal to total IPC number."
#endif

