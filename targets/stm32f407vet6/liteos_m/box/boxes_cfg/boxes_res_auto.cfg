#define LOSCFG_BOXA_TASK_LIMIT        2
#define LOSCFG_BOXA_EVENT_LIMIT       0
#define LOSCFG_BOXA_MUX_LIMIT         4
#define LOSCFG_BOXA_QUEUE_LIMIT       1
#define LOSCFG_BOXA_SEM_LIMIT         0
#define LOSCFG_BOXA_SHM_LIMIT         0
#define LOSCFG_BOXA_SWT_LIMIT         0
#define LOSCFG_BOXA_SID_LIMIT         5

#if LOSCFG_BOXA_SID_LIMIT < (LOSCFG_BOXA_EVENT_LIMIT + LOSCFG_BOXA_MUX_LIMIT + LOSCFG_BOXA_QUEUE_LIMIT + LOSCFG_BOXA_SEM_LIMIT + LOSCFG_BOXA_SHM_LIMIT)
#error "BOXA SID number should be larger than or equal to total IPC number."
#endif

#define LOSCFG_BOXB_TASK_LIMIT        1
#define LOSCFG_BOXB_EVENT_LIMIT       0
#define LOSCFG_BOXB_MUX_LIMIT         1
#define LOSCFG_BOXB_QUEUE_LIMIT       0
#define LOSCFG_BOXB_SEM_LIMIT         0
#define LOSCFG_BOXB_SHM_LIMIT         0
#define LOSCFG_BOXB_SWT_LIMIT         0
#define LOSCFG_BOXB_SID_LIMIT         1

#if LOSCFG_BOXB_SID_LIMIT < (LOSCFG_BOXB_EVENT_LIMIT + LOSCFG_BOXB_MUX_LIMIT + LOSCFG_BOXB_QUEUE_LIMIT + LOSCFG_BOXB_SEM_LIMIT + LOSCFG_BOXB_SHM_LIMIT)
#error "BOXB SID number should be larger than or equal to total IPC number."
#endif

#ifndef LOS_DYN_SYSCALL_LIB
extern LosTaskCB        g_boxaTaskCB[LOSCFG_BOXA_TASK_LIMIT];
extern LosTaskStack     g_boxaKerStack[LOSCFG_BOXA_TASK_LIMIT];
extern LosMuxCB         g_boxaMuxCB[LOSCFG_BOXA_MUX_LIMIT];
extern EntityObj        g_boxaMuxEntity[LOSCFG_BOXA_MUX_LIMIT];
extern LosQueueCB       g_boxaQueCB[LOSCFG_BOXA_QUEUE_LIMIT];
extern EntityObj        g_boxaQueEntity[LOSCFG_BOXA_QUEUE_LIMIT];
extern SIdObj           g_boxaSIdPool[LOSCFG_BOXA_SID_LIMIT];

extern LosTaskCB        g_boxbTaskCB[LOSCFG_BOXB_TASK_LIMIT];
extern LosTaskStack     g_boxbKerStack[LOSCFG_BOXB_TASK_LIMIT];
extern LosMuxCB         g_boxbMuxCB[LOSCFG_BOXB_MUX_LIMIT];
extern EntityObj        g_boxbMuxEntity[LOSCFG_BOXB_MUX_LIMIT];
extern SIdObj           g_boxbSIdPool[LOSCFG_BOXB_SID_LIMIT];
#endif